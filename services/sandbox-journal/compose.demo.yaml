# Disposable local demo only: synthetic data, public test password, no production use.
# Port is bound to loopback; docker compose down --volumes deletes the demo DB.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox_demo
      POSTGRES_PASSWORD: sandbox-demo-only
      POSTGRES_DB: sandbox_demo
    ports:
      - "127.0.0.1:${SANDBOX_DEMO_PORT:-55439}:5432"
    volumes:
      - ./migrations/0001_command_journal.sql:/docker-entrypoint-initdb.d/01_command.sql:ro
      - ./migrations/0002_lease_intents.sql:/docker-entrypoint-initdb.d/02_lease_intents.sql:ro
      - ./migrations/0003_lease_outbox_immutable.sql:/docker-entrypoint-initdb.d/03_lease_outbox.sql:ro
      - ./migrations/0004_lease_runtime_roles.sql:/docker-entrypoint-initdb.d/04_lease_roles.sql:ro
      - ./migrations/0005_command_journal_outbox_immutable.sql:/docker-entrypoint-initdb.d/05_command_outbox.sql:ro
      - ./migrations/0006_lease_commit_integrity.sql:/docker-entrypoint-initdb.d/06_lease_integrity.sql:ro
      - ./migrations/0007_tenant_login_rls.sql:/docker-entrypoint-initdb.d/07_tenant_rls.sql:ro
      - ./migrations/0008_tenant_login_oid_fence.sql:/docker-entrypoint-initdb.d/08_tenant_oid.sql:ro
      - ./migrations/0009_tenant_login_revoke_evict.sql:/docker-entrypoint-initdb.d/09_tenant_revoke.sql:ro
      - ./migrations/tests/0001_sandboxctl_smoke.sql:/docker-entrypoint-initdb.d/10_seed.sql:ro
      - ./migrations/tests/0002_sandboxctl_demo_reader.sql:/docker-entrypoint-initdb.d/11_reader.sql:ro
    healthcheck:
      # TCP + seeded-row check avoids reporting healthy during PostgreSQL's
      # temporary Unix-socket-only init server or before migrations complete.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=sandbox-demo-only psql -h 127.0.0.1
          -U sandbox_demo -d sandbox_demo -tAc
          "SELECT 1 FROM sandbox_journal_commands WHERE tenant_id='sandboxctl-smoke' AND command_id='command-smoke-1'"
          | grep -qx 1
      interval: 2s
      timeout: 3s
      retries: 25
