name: JetStream broker POC (non-production)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'experiments/jetstream-poc/**'
      - '.github/workflows/jetstream-poc.yml'
      - 'internal/inboxtransport/**'
      - 'internal/runintent/postgres/**'

permissions:
  contents: read

env:
  # Use the audited Go binary; do not silently download another toolchain.
  GOTOOLCHAIN: local

jobs:
  actual-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGTEST_DSN: postgres://postgres:agent-ci@127.0.0.1:5432/postgres?sslmode=disable
      NATS_POC_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agent-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # pinned v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go version
      - name: Launch real pinned JetStream server
        run: |
          docker run --pull=always -d --name acp-jetstream -p 4222:4222 nats:2.15.2@sha256:b6c40dcfe5ae9174dcafa9c43f800afb93b8b0ffcde02ac00efc6b66031d9a50 -js -sd /data
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/4222' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs acp-jetstream
          exit 1
      - name: Check POC Go formatting with actionable diff
        run: |
          if [ -n "$(gofmt -l experiments/jetstream-poc/*.go)" ]; then
            gofmt -d experiments/jetstream-poc/*.go
            exit 1
          fi
      - name: Verify pinned POC dependencies
        working-directory: experiments/jetstream-poc
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Execute actual broker and PostgreSQL race tests
        working-directory: experiments/jetstream-poc
        run: go test -race -count=1 -v ./...
      - name: Require real NATS mTLS identity and tenant ACL evidence
        working-directory: experiments/jetstream-poc
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestRealJetStreamMTLSAndTenantIsolation$' . | tee "$RUNNER_TEMP/jetstream-mtls.log"
          grep -F -- '--- PASS: TestRealJetStreamMTLSAndTenantIsolation' "$RUNNER_TEMP/jetstream-mtls.log"
          grep -F -- '--- PASS: TestRealJetStreamMTLSAndTenantIsolation/AuthenticatedInboxDLQRecovery' "$RUNNER_TEMP/jetstream-mtls.log"
          if grep -F -- '--- SKIP: TestRealJetStreamMTLSAndTenantIsolation' "$RUNNER_TEMP/jetstream-mtls.log"; then
            echo 'Required real NATS mTLS test was skipped' >&2
            exit 1
          fi
      # The ordinary PR checkout tests GitHub's synthetic merge tree. Repeat
      # the security-specific test on the literal immutable PR source SHA.
      - name: Checkout exact pull request source SHA
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require mTLS evidence on literal source HEAD
        if: github.event_name == 'pull_request'
        working-directory: experiments/jetstream-poc
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf 'VERIFIED_JETSTREAM_SOURCE_HEAD=%s\n' "$EXPECTED_SOURCE_SHA"
          go test -race -count=1 -v -run '^TestRealJetStreamMTLSAndTenantIsolation$' . | tee "$RUNNER_TEMP/jetstream-mtls-source.log"
          grep -F -- '--- PASS: TestRealJetStreamMTLSAndTenantIsolation' "$RUNNER_TEMP/jetstream-mtls-source.log"
          grep -F -- '--- PASS: TestRealJetStreamMTLSAndTenantIsolation/AuthenticatedInboxDLQRecovery' "$RUNNER_TEMP/jetstream-mtls-source.log"
          if grep -F -- '--- SKIP: TestRealJetStreamMTLSAndTenantIsolation' "$RUNNER_TEMP/jetstream-mtls-source.log"; then
            echo 'Literal-source NATS mTLS test was skipped' >&2
            exit 1
          fi
      - name: Report NATS logs on failure
        if: failure()
        run: |
          docker logs acp-jetstream || true
