name: JetStream broker POC (non-production)

on:
  pull_request:
    paths:
      - 'experiments/jetstream-poc/**'
      - '.github/workflows/jetstream-poc.yml'
      - 'internal/inboxtransport/**'
      - 'internal/runintent/postgres/**'

permissions:
  contents: read

jobs:
  actual-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGTEST_DSN: postgres://postgres:agent-ci@127.0.0.1:5432/postgres?sslmode=disable
      NATS_POC_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agent-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # pinned v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Launch real pinned JetStream server
        run: |
          docker run -d --name acp-jetstream -p 4222:4222 nats:2.15.2 -js -sd /data
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/4222' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs acp-jetstream
          exit 1
      - name: Resolve isolated POC dependencies (capture hashes)
        working-directory: experiments/jetstream-poc
        run: |
          go mod tidy
          echo '--- GENERATED GO MOD ---'
          cat go.mod
          echo '--- GENERATED GO SUM ---'
          cat go.sum
      - name: Execute actual broker and PostgreSQL race tests
        working-directory: experiments/jetstream-poc
        run: go test -race -count=1 -v ./...
      - name: Report NATS logs on failure
        if: failure()
        run: docker logs acp-jetstream || true
