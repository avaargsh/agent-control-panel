name: Portfolio CI metadata validation (non-production)

on:
  pull_request:
    paths:
      - 'scripts/portfolio_ci_receipt.py'
      - 'tests/test_portfolio_ci_receipt.py'
      - '.github/workflows/portfolio-ci-receipt.yml'
      - 'docs/implementation/PORTFOLIO-VALIDATION-DEMO.md'

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          persist-credentials: false
      - name: Validate exact-run receipt negative cases
        run: python3 -m unittest discover -s tests -p 'test_portfolio_ci_receipt.py' -v
