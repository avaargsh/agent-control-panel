name: Live OIDC service-account admission (non-production)

on:
  pull_request:
    paths:
      - 'cmd/acp-goal/**'
      - 'cmd/acp-goal-api/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/admission/**'
      - 'internal/goalhttp/**'
      - 'internal/issuegoal/**'
      - 'internal/runintent/**'
      - 'migrations/**'
      - 'scripts/test-real-oidc-admission.sh'
      - '.github/workflows/real-oidc-admission.yml'
  workflow_dispatch:

# Only read-only repository/Issue access; this workflow never writes GitHub.
permissions:
  contents: read
  issues: read

env:
  GOTOOLCHAIN: local

jobs:
  live-issuer:
    # Do not expose the ephemeral GitHub API token to untrusted fork PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acp_oidc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acp_oidc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 pinned
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify patched Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.4"
      - name: Real Keycloak + PostgreSQL admission and live public GitHub Issue GoalSubmit
        env:
          # GitHub's automatically expiring job token; read-only scopes above.
          # Never echo or persist it in logs/artifacts.
          ACP_REAL_GITHUB_READ_TOKEN: ${{ github.token }}
          PGTEST_DSN: postgres://postgres:acp-test-only@127.0.0.1:5432/acp_oidc?sslmode=disable
        run: bash scripts/test-real-oidc-admission.sh

# Executes opt-in live public GitHub Issue #70 admission against a disposable
# Keycloak realm and PostgreSQL schema: actual public source reads, never writes.
# No interactive human OIDC, protected GitHub branch assertion, deployed IAM,
# credential broker, production IdP or protected effect/Runtime dispatch.
