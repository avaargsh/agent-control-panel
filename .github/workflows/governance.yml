name: governance-manifest

on:
  pull_request:
    paths:
      - "governance/**"
      - "scripts/audit_pr_topology.py"
      - "tests/test_pr_topology.py"
      - "scripts/check_governance.py"
      - "tests/test_governance.py"
      - ".github/workflows/governance.yml"
      - "docs/governance/**"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "scripts/check_governance.py"
      - "tests/test_governance.py"
      - ".github/workflows/governance.yml"
      - "docs/governance/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 tag pinned to immutable commit
        with:
          python-version: "3.12"
      - run: python scripts/check_governance.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
