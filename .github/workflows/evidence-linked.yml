name: Signed evidence receipt links (offline candidate)

on:
  pull_request:
    paths:
      - 'internal/evidencepackage/**'
      - 'cmd/acp-evidence-verify/**'
      - '.github/workflows/evidence-linked.yml'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  read-only-linked-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 pinned
        with:
          go-version: '1.27.4'
          cache: false
      - name: Require audited local Go
        run: test "$(go env GOVERSION)" = "go1.27.4"
      - name: Require gofmt and module authenticity
        run: |
          test -z "$(gofmt -l ./internal/evidencepackage ./cmd/acp-evidence-verify)"
          go mod verify
      - name: Independent signed-link parser and CLI negative tests
        run: go test -race -count=1 ./internal/evidencepackage ./cmd/acp-evidence-verify
