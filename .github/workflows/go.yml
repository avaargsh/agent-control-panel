name: Go and PostgreSQL validation

on:
  push:
    branches: [main]
  pull_request:

# Coalesce superseded PR runs only; preserve main and manual evidence.
concurrency:
  group: acp-ci-go-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Use the audited Go binary; do not silently download another toolchain.
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PGTEST_DSN: postgres://postgres:agent-ci@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agent-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 pinned
        with:
          go-version: '1.27.4'
          cache: false
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go version
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d .
            exit 1
          fi
      - name: Verify module graph and checksums
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: agent-ci
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --file=migrations/0001_run_intents_outbox_inbox.sql
      # A real physical standby lets the primary-fence regression exercise
      # both hot-standby rejection and promotion to a different writable primary.
      - name: Provision physical PostgreSQL standby for failover fencing
        shell: bash
        env:
          PGTEST_STANDBY_DSN: postgres://postgres:agent-ci@127.0.0.1:5433/postgres?sslmode=disable
        run: |
          set -euo pipefail
          primary_container="$(docker ps -q --filter publish=5432 | head -n1)"
          test -n "$primary_container"
          test "$(psql "$PGTEST_DSN" -Atqc 'SHOW wal_level')" = "replica"
          test "$(psql "$PGTEST_DSN" -Atqc 'SHOW max_wal_senders')" -ge 1
          psql "$PGTEST_DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE acp_repl WITH REPLICATION LOGIN PASSWORD 'acp-repl-ci'"
          docker exec -u postgres "$primary_container" sh -c 'printf "%s\n" "host replication acp_repl 0.0.0.0/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"; pg_ctl reload -D "$PGDATA"'
          docker run -d --name acp-standby --network host --entrypoint sleep postgres:16-alpine infinity
          docker exec -u postgres -e PGPASSWORD=acp-repl-ci acp-standby pg_basebackup -h 127.0.0.1 -p 5432 -U acp_repl -D /var/lib/postgresql/data -Fp -Xs -P -R
          docker exec -d -u postgres acp-standby postgres -D /var/lib/postgresql/data -p 5433
          for attempt in $(seq 1 60); do
            if PGPASSWORD=agent-ci psql "$PGTEST_STANDBY_DSN" -Atqc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          test "$(PGPASSWORD=agent-ci psql "$PGTEST_STANDBY_DSN" -Atqc 'SELECT pg_is_in_recovery()')" = "t"
          for attempt in $(seq 1 60); do
            replicas="$(psql "$PGTEST_DSN" -Atqc "SELECT count(*) FROM pg_stat_replication WHERE usename = 'acp_repl'")"
            if [ "$replicas" -ge 1 ]; then
              break
            fi
            sleep 1
          done
          test "$replicas" -ge 1
      - name: Assert tenant-isolated aggregate claims and cursors
        env:
          PGPASSWORD: agent-ci
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --file=migrations/tests/0001_tenant_isolation.sql
      - name: Static analysis
        run: go vet ./...
      - name: Enforce independently authenticated authority role negative gate
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run TestAuthorityDatabaseRoleFailClosed ./cmd/acp-authority-api | tee role-test.log
          grep -F -- '--- PASS: TestAuthorityDatabaseRoleFailClosed' role-test.log
          if grep -F -- '--- SKIP: TestAuthorityDatabaseRoleFailClosed' role-test.log; then
            echo 'PGTEST_DSN role test was skipped: refuse security receipt' >&2
            exit 1
          fi
      # A PostgreSQL TEMP relation can shadow unqualified application tables.
      # Test on a disposable DB so shared PGTEST_DSN permissions stay unchanged.
      - name: Enforce real PostgreSQL TEMP-shadow rejection
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run TestAuthorityDatabaseRoleRejectsTempShadow ./cmd/acp-authority-api | tee temp-shadow-test.log
          grep -F -- '--- PASS: TestAuthorityDatabaseRoleRejectsTempShadow' temp-shadow-test.log
          if grep -F -- '--- SKIP: TestAuthorityDatabaseRoleRejectsTempShadow' temp-shadow-test.log; then
            echo 'PostgreSQL TEMP-shadow role test was skipped' >&2
            exit 1
          fi
      - name: Enforce live authority HTTP database-role drift gate
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestAuthorityHTTPRejectsRuntimeRoleDrift$' ./cmd/acp-authority-api | tee drift-test.log
          grep -F -- '--- PASS: TestAuthorityHTTPRejectsRuntimeRoleDrift' drift-test.log
          if grep -F -- '--- SKIP: TestAuthorityHTTPRejectsRuntimeRoleDrift' drift-test.log; then
            echo 'live PG/TLS authority drift gate was skipped' >&2
            exit 1
          fi
      - name: Prove two-tenant admission and input isolation against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run TestTwoTenantCatalogScopesRealPostgres ./internal/admission | tee tenant-test.log
          grep -F -- '--- PASS: TestTwoTenantCatalogScopesRealPostgres' tenant-test.log
          if grep -F -- '--- SKIP: TestTwoTenantCatalogScopesRealPostgres' tenant-test.log; then
            echo 'two-tenant PostgreSQL isolation test was skipped' >&2
            exit 1
          fi
      - name: Require real PostgreSQL cutover probes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PGTEST_DSN"
          go test -race -count=1 -v -run '^TestAuthorityCutoverPostgres(DrainPrimitive|GenerationCAS|StoreContract|Migration|LedgerACL|BarrierCoordinatesIndependentReplicas)$' ./cmd/acp-authority-api | tee cutover-probes.log
          for probe in TestAuthorityCutoverPostgresDrainPrimitive TestAuthorityCutoverPostgresGenerationCAS TestAuthorityCutoverPostgresStoreContract TestAuthorityCutoverPostgresMigration TestAuthorityCutoverPostgresLedgerACL TestAuthorityCutoverPostgresBarrierCoordinatesIndependentReplicas; do
            grep -F -- "--- PASS: $probe (" cutover-probes.log
            if grep -F -- "--- SKIP: $probe" cutover-probes.log; then
              echo "Required cutover probe skipped: $probe" >&2
              exit 1
            fi
          done
      - name: Require Guard cancellation mTLS regression
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS$' ./internal/authorityhttp | tee guard-cancel.log
          for probe in capability protected_workspace; do
            grep -F -- "--- PASS: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS/$probe (" guard-cancel.log
          done
          grep -F -- '--- PASS: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS (' guard-cancel.log
          if grep -F -- '--- SKIP: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS' guard-cancel.log; then
            echo 'Guard cancellation regression skipped' >&2
            exit 1
          fi
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
      - name: Require physical PostgreSQL standby and failover fencing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PGTEST_STANDBY_DSN: postgres://postgres:agent-ci@127.0.0.1:5433/postgres?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover$' ./internal/authoritycutover | tee failover-fence.log
          grep -F -- '--- PASS: TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover' failover-fence.log
          if grep -F -- '--- SKIP: TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover' failover-fence.log; then
            echo 'physical PostgreSQL failover fencing regression was skipped' >&2
            exit 1
          fi
      # The regular PR checkout above tests GitHub's synthetic merge commit.
      # Security approval additionally needs the literal immutable PR source:
      # do not pass synthetic-merge tests off as source HEAD evidence.
      - name: Checkout exact pull request source SHA
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify literal source HEAD security regression and race
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PGTEST_STANDBY_DSN: postgres://postgres:agent-ci@127.0.0.1:5433/postgres?sslmode=disable
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf 'VERIFIED_SOURCE_ONLY_HEAD=%s\n' "$EXPECTED_SOURCE_SHA"
          go test -count=1 -v -run '^TestAuthorityDatabaseRoleFailClosed$' ./cmd/acp-authority-api | tee source-head-role.log
          grep -F -- '--- PASS: TestAuthorityDatabaseRoleFailClosed' source-head-role.log
          if grep -F -- '--- SKIP: TestAuthorityDatabaseRoleFailClosed' source-head-role.log; then
            echo 'source HEAD real PostgreSQL role security test was skipped' >&2
            exit 1
          fi
          go test -race -count=1 ./cmd/acp-authority-api
          go test -race -count=1 -v -run '^TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover$' ./internal/authoritycutover | tee failover-fence.log
          grep -F -- '--- PASS: TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover' failover-fence.log
          if grep -F -- '--- SKIP: TestPrimaryFenceRejectsStandbyAndPromotedPrimaryAfterFailover' failover-fence.log; then
            echo 'literal source HEAD physical failover regression was skipped' >&2
            exit 1
          fi
          test -n "$PGTEST_DSN"
          go test -race -count=1 -v -run '^TestAuthorityCutoverPostgres(DrainPrimitive|GenerationCAS|StoreContract|Migration|LedgerACL|BarrierCoordinatesIndependentReplicas)$' ./cmd/acp-authority-api | tee cutover-probes.log
          for probe in TestAuthorityCutoverPostgresDrainPrimitive TestAuthorityCutoverPostgresGenerationCAS TestAuthorityCutoverPostgresStoreContract TestAuthorityCutoverPostgresMigration TestAuthorityCutoverPostgresLedgerACL TestAuthorityCutoverPostgresBarrierCoordinatesIndependentReplicas; do
            grep -F -- "--- PASS: $probe (" cutover-probes.log
            if grep -F -- "--- SKIP: $probe" cutover-probes.log; then
              echo "Required cutover probe skipped: $probe" >&2
              exit 1
            fi
          done
          go test -race -count=1 -v -run '^TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS$' ./internal/authorityhttp | tee guard-cancel.log
          for probe in capability protected_workspace; do
            grep -F -- "--- PASS: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS/$probe (" guard-cancel.log
          done
          grep -F -- '--- PASS: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS (' guard-cancel.log
          if grep -F -- '--- SKIP: TestGuardReadEndpointsRejectCancelledSuccessfulAuthorityReadOverMTLS' guard-cancel.log; then
            echo 'Guard cancellation regression skipped' >&2
            exit 1
          fi

      - name: Remove temporary physical PostgreSQL standby
        if: always()
        run: docker rm -f acp-standby >/dev/null 2>&1 || true
