name: Go validation

on:
  push:
    branches: [main, "feat/go-foundation"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PGTEST_DSN: postgres://agentcp:agentcp-ci-password@127.0.0.1:5432/agentcp?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentcp
          POSTGRES_PASSWORD: agentcp-ci-password
          POSTGRES_DB: agentcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcp -d agentcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, immutable commit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, immutable commit
        with:
          go-version: '1.27.3'
          cache: false
      - name: Diagnose Go formatting
        continue-on-error: true
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Verify module graph
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Static analysis
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -count=1 ./...
