name: ACP admission-origin behavioral regression (non-production)
on:
  pull_request:
    paths:
      - 'internal/runintent/postgres/admission_origin_replay_integration_test.go'
      - '.github/workflows/admission-origin-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGTEST_DSN: postgres://postgres:isolated-test-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8c4c3cabf427371a3518b84ae1f572798f475bd0
          path: pre-fix
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Reproduce the same behavior test on exact pre-fix source
        run: |
          set -euo pipefail
          test "$(git -C pre-fix rev-parse HEAD)" = '8c4c3cabf427371a3518b84ae1f572798f475bd0'
          test "$(go env GOVERSION)" = 'go1.27.4'
          file=internal/runintent/postgres/admission_origin_replay_integration_test.go
          cp "candidate/$file" "pre-fix/$file"
          cd pre-fix
          set +e
          go test -race -count=1 -v -run '^TestCatalogReplayCannotSwitchAuthenticatedClient$' ./internal/runintent/postgres > "$RUNNER_TEMP/origin-red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/origin-red.log"
          test "$code" -eq 1
          grep -Fq '=== RUN   TestCatalogReplayCannotSwitchAuthenticatedClient' "$RUNNER_TEMP/origin-red.log"
          grep -Fq 'ADMISSION_ORIGIN_REPLAY_BYPASS: different client received original admitted RunIntent' "$RUNNER_TEMP/origin-red.log"
          grep -Fq -- '--- FAIL: TestCatalogReplayCannotSwitchAuthenticatedClient' "$RUNNER_TEMP/origin-red.log"
      - name: Verify identical behavior test on candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestCatalogReplayCannotSwitchAuthenticatedClient$' ./internal/runintent/postgres | tee "$RUNNER_TEMP/origin-green.log"
          grep -Fq '=== RUN   TestCatalogReplayCannotSwitchAuthenticatedClient' "$RUNNER_TEMP/origin-green.log"
          grep -Fq -- '--- PASS: TestCatalogReplayCannotSwitchAuthenticatedClient ' "$RUNNER_TEMP/origin-green.log"
