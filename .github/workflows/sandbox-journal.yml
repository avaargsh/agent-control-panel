name: Sandbox-owned Command Journal (non-dispatch)

on:
  pull_request:
    paths:
      - 'services/sandbox-journal/**'
      - '.github/workflows/sandbox-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sandbox_journal_ci
          POSTGRES_USER: sandbox_ci
          POSTGRES_PASSWORD: sandbox-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox_ci -d sandbox_journal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SANDBOX_JOURNAL_TEST_DSN: postgres://sandbox_ci:sandbox-test-only@127.0.0.1:5432/sandbox_journal_ci?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Assert patched toolchain
        run: test "$(go env GOVERSION)" = "go1.27.4"
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l services/sandbox-journal)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d services/sandbox-journal
            exit 1
          fi
      - name: Verify independent module hashes
        working-directory: services/sandbox-journal
        run: go mod verify
      - name: Sandbox journal PostgreSQL replay and rollback tests
        working-directory: services/sandbox-journal
        run: go test -race -count=1 -v ./...
      - name: Vet independent sandbox module
        working-directory: services/sandbox-journal
        run: go vet ./...
