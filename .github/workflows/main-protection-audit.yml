name: Main protection read-only audit

on:
  pull_request:
    paths:
      - 'scripts/audit_main_protection.py'
      - 'tests/test_main_protection_audit.py'
      - 'docs/operations/MAIN-PROTECTION-AUDIT.md'
      - '.github/workflows/main-protection-audit.yml'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact 40-character current main commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exercise fail-closed audit regression cases
        run: python3 -m unittest discover -s tests -p test_main_protection_audit.py -v
      - name: Inspect live server rules only when explicitly requested
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_MAIN: ${{ inputs.expected_main }}
        run: |
          python3 scripts/audit_main_protection.py \
            --repository '${{ github.repository }}' \
            --expected-main "$EXPECTED_MAIN"
