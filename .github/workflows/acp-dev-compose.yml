name: ACP development Compose

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/acp-dev-compose.yml'
      - 'deploy/dev/**'
      - 'cmd/acp-devctl/**'
      - 'cmd/agent-control-panel/**'
      - 'internal/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  dev-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm exact merge checkout and local Docker
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'ACP_COMPOSE_MERGE_SHA=%s\n' "$GITHUB_SHA"
          docker version --format 'Engine {{.Server.Version}}'
          docker compose version
      - name: Build, start, and verify the documented stack
        run: ./deploy/dev/verify.sh
      - name: Verify migration ledger survives stack restart
        shell: bash
        run: |
          set -euo pipefail
          ledger() {
            ./deploy/dev/compose.sh exec -T db psql -XAt -v ON_ERROR_STOP=1 -U acp_dev -d acp_dev \
              -c "SELECT count(*), max(version), md5(string_agg(checksum || applied_at::text, ',' ORDER BY version)) FROM schema_migrations;"
          }
          before=$(ledger)
          test "${before%%|*}" -gt 0
          ./deploy/dev/compose.sh down
          ./deploy/dev/compose.sh up --wait --wait-timeout 120
          test "$(ledger)" = "$before"
          test "$(curl --noproxy '*' -fsS --max-time 5 http://127.0.0.1:18080/readyz)" = ready
          echo ACP_COMPOSE_PERSISTENCE_PASS
      - name: Clean up only this checkout's stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          project_file=deploy/dev/.secrets/project-name
          if [[ ! -f "$project_file" ]]; then
            exit 0
          fi
          project=$(cat "$project_file")
          ./deploy/dev/compose.sh down --volumes
          label="label=com.docker.compose.project=$project"
          test -z "$(docker ps --all --quiet --filter "$label")"
          test -z "$(docker network ls --quiet --filter "$label")"
          test -z "$(docker volume ls --quiet --filter "$label")"
          echo ACP_COMPOSE_CLEANUP_PASS
