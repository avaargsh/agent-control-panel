name: Contract conformance

on:
  pull_request:
  push:
    branches: [main, "feature/platform-foundation"]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema[format]==4.25.1 rfc8785==0.1.4
      - name: Validate schemas, fixtures and ActionHash vectors
        run: python3 contracts/validate_contracts.py
