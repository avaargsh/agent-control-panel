name: Legacy compatibility snapshot checks

on:
  pull_request:
  push:
    branches: [main]

# Coalesce superseded PR runs only; preserve main and manual evidence.
concurrency:
  group: acp-ci-contracts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema[format]==4.25.1 rfc8785==0.1.4
      - name: Validate ACP-local non-normative compatibility snapshots
        run: python3 contracts/validate_contracts.py
