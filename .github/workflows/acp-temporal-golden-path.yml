name: Same ACP Run real Guard Plan Step mTLS (non-production)

on:
  pull_request:
    paths:
      - 'internal/runtimeinspect/**'
      - 'internal/postfault/**'
      - 'internal/evidencepackage/**'
      - 'cmd/acp-postfault-verify/**'
      - 'cmd/acp-evidence-verify/**'
      - 'internal/admission/**'
      - 'internal/authorityhttp/**'
      - 'cmd/acp-authority-api/**'
      - 'internal/runintent/**'
      - 'migrations/**'
      - '.github/workflows/acp-temporal-golden-path.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: acp
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: avaargsh/agent-control-panel
          ref: 5b0109cbafcf659f2230f7a38fc560b8644332a9
          path: issuer-fixture
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: avaargsh/agent-runtime
          ref: 8e0c25a77f9e17e944e34f836bf83bdbac85ed56
          path: runtime-api
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: avaargsh/agent-decision
          ref: 975a052995e1f779413dfe2a7fadba7abafafabc
          path: decision
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: avaargsh/EngageGuard
          ref: 0104f4e94634c9311837ffe7b084562b0f722dbc
          path: guard
          persist-credentials: false
      - name: Verify immutable external source pins
        env:
          EXPECTED_ACP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C acp rev-parse HEAD)" = "$EXPECTED_ACP_SOURCE_SHA"
          printf 'VERIFIED_ACP_SOURCE_HEAD=%s\n' "$EXPECTED_ACP_SOURCE_SHA"
          test "$(git -C issuer-fixture rev-parse HEAD)" = '5b0109cbafcf659f2230f7a38fc560b8644332a9'
          test "$(git -C runtime-api rev-parse HEAD)" = '8e0c25a77f9e17e944e34f836bf83bdbac85ed56'
          test "$(git -C decision rev-parse HEAD)" = '975a052995e1f779413dfe2a7fadba7abafafabc'
          test "$(git -C guard rev-parse HEAD)" = '0104f4e94634c9311837ffe7b084562b0f722dbc'
          git -C acp rev-parse HEAD
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify patched toolchain
        run: test "$(go env GOVERSION)" = "go1.27.4"
      - name: Create separate authoritative databases
        env:
          PGPASSWORD: acp-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE acp_golden'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE runtime_golden'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE decision_golden'
      - name: Compile actual ACP authority API
        working-directory: acp
        run: go build -trimpath -o "$RUNNER_TEMP/acp-authority-api" ./cmd/acp-authority-api
      - name: Compile actual authenticated Runtime API
        working-directory: runtime-api
        run: go build -trimpath -o "$RUNNER_TEMP/acp-runtime-api" ./cmd/acp-api
      - name: Compile actual Runtime Decision authority process
        working-directory: runtime-api
        run: go build -trimpath -o "$RUNNER_TEMP/runtime-decision-authority" ./cmd/decision-authority-api
      - name: Compile actual Temporal integration driver
        working-directory: runtime-api
        run: go test -race -c -o "$RUNNER_TEMP/runtime-temporal-acceptance" ./internal/store/postgres
      - name: Compile independent Decision publication verifier
        working-directory: decision
        run: go test -race -c -o "$RUNNER_TEMP/decision-publication-verifier" ./internal/decision
      - name: Compile independently authenticated actual Decision Core acceptance
        working-directory: decision
        run: go test -race -c -o "$RUNNER_TEMP/live-decision-core" ./internal/evidenceauthority
      - name: Compile actual EngageGuard mTLS DecisionPlanClient driver
        working-directory: guard
        run: go test -race -c -o "$RUNNER_TEMP/live-guard-client" ./internal/admission
      - name: Execute live OAuth to same Run Temporal recovery and Decision acceptance
        working-directory: acp
        env:
          ACP_CROSS_SERVICE: '1'
          ACP_LIVE_DECISION: '1'
          ACP_LIVE_GUARD_STEP: '1'
          ACP_LIVE_GUARD_CLIENT: '1'
          ACP_GUARD_TEST_BIN: ${{ runner.temp }}/live-guard-client
          ACP_LIVE_CONTINUATION: '1'
          ACP_RUNTIME_DECISION_AUTHORITY_BIN: ${{ runner.temp }}/runtime-decision-authority
          ACP_DECISION_LIVE_CORE_BIN: ${{ runner.temp }}/live-decision-core
          ACP_DECISION_DATABASE_URL: postgres://postgres:acp-test-only@127.0.0.1:5432/decision_golden?sslmode=disable
          ACP_AUTHORITY_API_BIN: ${{ runner.temp }}/acp-authority-api
          ACP_DECISION_PUBLICATION_TEST_BIN: ${{ runner.temp }}/decision-publication-verifier
          ACP_DATABASE_URL: postgres://postgres:acp-test-only@127.0.0.1:5432/acp_golden?sslmode=disable
          ACP_RUNTIME_DATABASE_URL: postgres://postgres:acp-test-only@127.0.0.1:5432/runtime_golden?sslmode=disable
          ACP_RUNTIME_API_BIN: ${{ runner.temp }}/acp-runtime-api
          ACP_RUNTIME_TEMPORAL_TEST_BIN: ${{ runner.temp }}/runtime-temporal-acceptance
          PGTEST_DSN: postgres://postgres:acp-test-only@127.0.0.1:5432/acp_golden?sslmode=disable
        run: bash ../issuer-fixture/scripts/test-real-oidc-admission.sh golden-path
      - name: Real Linux process SIGKILL and physical workspace re-read (local-only precursor)
        working-directory: acp
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^(TestPhysicalWorkspace|TestLocalWorkspaceRejects|TestLocalWorkspaceReadRejects|TestLocalUnknownCommandAfterSIGKILLRemainsBlocked|TestLocalUnknownCommandRejectsForgedReconciliation)' ./internal/postfault | tee "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- '--- PASS: TestPhysicalWorkspaceSurvivesWorkerSIGKILL ' "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- '--- PASS: TestPhysicalWorkspaceRecoveryRejectsCorruptionAndStaleBinding ' "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- '--- PASS: TestLocalWorkspaceRejectsHardLinkedSiblingTenantFile ' "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- '--- PASS: TestLocalUnknownCommandAfterSIGKILLRemainsBlocked ' "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- '--- PASS: TestLocalUnknownCommandRejectsForgedReconciliation ' "$RUNNER_TEMP/acp-local-workspace.log"
          grep -q -- 'LOCAL_UNKNOWN_COMMAND_SIGKILL_HOLD_CONFIRMED' "$RUNNER_TEMP/acp-local-workspace.log"
      - name: Compile independent post-fault continuity verifier
        working-directory: acp
        run: go build -trimpath -o "$RUNNER_TEMP/acp-postfault-verify" ./cmd/acp-postfault-verify
      - name: Compile independent G01-G05 evidence package verifier
        working-directory: acp
        run: go build -trimpath -o "$RUNNER_TEMP/acp-evidence-verify" ./cmd/acp-evidence-verify
      - name: Require same-Run Sandbox workspace, Command UNKNOWN and Guard Epoch proof
        # Intentionally not continue-on-error. This is the extended recovery
        # gate, not a static fixture or a synthetic replacement for providers.
        env:
          AGENTD_EVIDENCE_ENDPOINT: ${{ vars.ACP_AGENTD_EVIDENCE_ENDPOINT }}
          AGENTD_EVIDENCE_SERVER_NAME: ${{ vars.ACP_AGENTD_EVIDENCE_SERVER_NAME }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/acp-postfault/proof.json"
          expected="$RUNNER_TEMP/acp-postfault/expected.json"
          trust="$RUNNER_TEMP/acp-postfault/trust"
          mtls="$RUNNER_TEMP/acp-agentd-mtls"
          client_cert="$mtls/client.crt"
          client_key="$mtls/client.key"
          server_ca="$mtls/server-ca.pem"
          if [ ! -s "$bundle" ] || [ ! -s "$expected" ] || [ ! -d "$trust" ]; then
            echo "::error::EXTENDED GOLDEN PATH BLOCKED: no real, independently signed Sandbox/AgentD/Guard/Runtime post-fault proof for this Run."
            exit 1
          fi
          if [ -z "${AGENTD_EVIDENCE_ENDPOINT:-}" ] || [ -z "${AGENTD_EVIDENCE_SERVER_NAME:-}" ] ||
             [ ! -s "$client_cert" ] || [ ! -s "$client_key" ] || [ ! -s "$server_ca" ]; then
            echo "::error::EXTENDED GOLDEN PATH BLOCKED: no per-Run AgentD mTLS endpoint, client identity/key and pinned server CA were provisioned by the trusted workload identity issuer."
            exit 1
          fi
          "$RUNNER_TEMP/acp-postfault-verify" \
            --bundle "$bundle" \
            --expected "$expected" \
            --trust-dir "$trust" \
            --agentd-evidence-endpoint "$AGENTD_EVIDENCE_ENDPOINT" \
            --agentd-client-cert "$client_cert" \
            --agentd-client-key "$client_key" \
            --agentd-server-ca "$server_ca" \
            --agentd-server-name "$AGENTD_EVIDENCE_SERVER_NAME"
      - name: Require original signed G01-G05 lifecycle Evidence Package
        # This is a second independent gate, NOT a fixture-to-green adapter.
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/acp-evidence/package.json"
          expected="$RUNNER_TEMP/acp-evidence/expected.json"
          trust="$RUNNER_TEMP/acp-evidence/trust"
          if [ ! -s "$package" ] || [ ! -s "$expected" ] || [ ! -d "$trust" ]; then
            echo "::error::G01-G05 EVIDENCE BLOCKED: no same-Run independently signed lifecycle, Sandbox and Compute release artifacts. Source-owned physical provider inspection is still required."
            exit 1
          fi
          "$RUNNER_TEMP/acp-evidence-verify" --package "$package" --expected "$expected" --trust-dir "$trust"


# One pinned Runtime candidate provides v12 API and business driver.
# The driver uses the actually accepted Run, not a probe or seeded Run.
# Actual Decision API/source registries remain live through post-CAS Worker
# SIGKILL recovery. New Guard-only mTLS test shares committed live
# DecisionRecord and denies source revocation. It is NOT a Sandbox/AgentD
# execution or a Guard Permit. The mandatory extended gate intentionally
# fails until separately owned trusted producers write real post-fault
# receipts to RUNNER_TEMP/acp-postfault and the independent validator accepts
# them. Never fabricate those artifacts or turn this into continue-on-error.
